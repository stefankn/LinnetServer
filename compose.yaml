services:
  linnetserver:
    image: linnetserver
    build:
      context: .
      dockerfile: LinnetServer/Dockerfile
    env_file: .env
    ports:
      - "8091:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: linnet
      POSTGRES_USER: linnet
      POSTGRES_PASSWORD: linnet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linnet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

